<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="sacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#sbg)"/>
  <rect width="1280" height="6" fill="url(#sacc)"/>

  <text x="80" y="216" font-size="104" font-weight="700" fill="#e6edf3" letter-spacing="-3">toolcheck</text>
  <text x="80" y="278" font-size="34" fill="#8b949e">Should you actually install that?</text>

  <text x="80" y="352" font-size="21" fill="#6e7681">A plain-English fit check for any repo, package, API or MCP server.</text>
  <text x="80" y="386" font-size="21" fill="#6e7681">Every fact sourced. Nothing guessed.</text>

  <g transform="translate(80, 434)">
    <rect x="0" y="0" width="104" height="40" rx="8" fill="#238636"/>
    <text x="52" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">USE IT</text>

    <rect x="120" y="0" width="238" height="40" rx="8" fill="#1f6feb"/>
    <text x="239" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">ALREADY HAVE THIS</text>

    <rect x="374" y="0" width="94" height="40" rx="8" fill="#9e6a03"/>
    <text x="421" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">RISKY</text>

    <rect x="484" y="0" width="104" height="40" rx="8" fill="#484f58"/>
    <text x="536" y="26" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">SKIP IT</text>
  </g>

  <text x="80" y="562" font-size="18" fill="#484f58">Free and open source</text>
  <text x="1200" y="562" font-size="18" fill="#6e7681" text-anchor="end">Fallback Labs</text>
  <line x1="80" y1="522" x2="1200" y2="522" stroke="#21262d" stroke-width="1"/>
</svg>
