<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#2f81f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#accent)"/>

  <!-- wordmark -->
  <text x="80" y="150" font-size="76" font-weight="700" fill="#e6edf3" letter-spacing="-2">toolcheck</text>
  <text x="80" y="196" font-size="26" fill="#8b949e">Should you actually install that?</text>
  <text x="80" y="244" font-size="17" fill="#6e7681">A fit check for any repo, package, API or MCP server,</text>
  <text x="80" y="268" font-size="17" fill="#6e7681">answered in plain English, with sources.</text>

  <!-- mini card preview -->
  <g transform="translate(760, 62)">
    <rect x="0" y="0" width="380" height="216" rx="10" fill="#010409" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="20" r="5" fill="#febc2e"/>
    <circle cx="56" cy="20" r="5" fill="#28c840"/>

    <text x="20" y="60" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8b949e">$ /toolcheck elevenlabs-mcp</text>

    <rect x="20" y="78" width="82" height="22" rx="4" fill="#238636"/>
    <text x="34" y="93" font-size="12" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffffff">USE IT</text>

    <text x="20" y="128" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7d8590">alive      updated yesterday</text>
    <text x="20" y="150" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7d8590">safe       no advisories</text>
    <text x="20" y="172" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7d8590">overlap    none found</text>
    <text x="20" y="194" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#d29922">cost       free tier is non-commercial</text>
  </g>
</svg>
