<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="420" fill="#0d1117"/>

  <text x="60" y="54" font-size="24" font-weight="700" fill="#e6edf3">How it works</text>
  <text x="60" y="82" font-size="15" fill="#8b949e">Four steps. Roughly twenty seconds. No configuration.</text>

  <!-- step 1 -->
  <g transform="translate(60, 120)">
    <rect width="240" height="200" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="30" cy="36" r="15" fill="#1f6feb"/>
    <text x="30" y="41" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="58" y="41" font-size="16" font-weight="600" fill="#e6edf3">You ask</text>
    <text x="20" y="86" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#3fb950">/toolcheck</text>
    <text x="20" y="106" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7d8590">some-package</text>
    <text x="20" y="146" font-size="13" fill="#8b949e">A name, or paste any</text>
    <text x="20" y="166" font-size="13" fill="#8b949e">GitHub or npm link.</text>
  </g>

  <path d="M310 220 L 342 220" stroke="#30363d" stroke-width="2"/>
  <path d="M336 214 L 344 220 L 336 226" fill="#30363d"/>

  <!-- step 2 -->
  <g transform="translate(355, 120)">
    <rect width="240" height="200" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="30" cy="36" r="15" fill="#1f6feb"/>
    <text x="30" y="41" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="58" y="41" font-size="16" font-weight="600" fill="#e6edf3">Reads your setup</text>
    <text x="20" y="82" font-size="13" fill="#8b949e">Your installed packages,</text>
    <text x="20" y="102" font-size="13" fill="#8b949e">MCP servers and skills.</text>
    <text x="20" y="140" font-size="12" fill="#6e7681">Names of things only.</text>
    <text x="20" y="160" font-size="12" fill="#6e7681">Never the values inside</text>
    <text x="20" y="180" font-size="12" fill="#6e7681">your .env files.</text>
  </g>

  <path d="M605 220 L 637 220" stroke="#30363d" stroke-width="2"/>
  <path d="M631 214 L 639 220 L 631 226" fill="#30363d"/>

  <!-- step 3 -->
  <g transform="translate(650, 120)">
    <rect width="240" height="200" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="30" cy="36" r="15" fill="#1f6feb"/>
    <text x="30" y="41" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="58" y="41" font-size="16" font-weight="600" fill="#e6edf3">Checks live sources</text>
    <text x="20" y="82" font-size="13" fill="#8b949e">GitHub, deps.dev, OSV,</text>
    <text x="20" y="102" font-size="13" fill="#8b949e">the real pricing page.</text>
    <text x="20" y="140" font-size="12" fill="#6e7681">Fetched now, not recalled</text>
    <text x="20" y="160" font-size="12" fill="#6e7681">from memory. Anything</text>
    <text x="20" y="180" font-size="12" fill="#6e7681">unverifiable says UNKNOWN.</text>
  </g>

  <path d="M900 220 L 932 220" stroke="#30363d" stroke-width="2"/>
  <path d="M926 214 L 934 220 L 926 226" fill="#30363d"/>

  <!-- step 4 -->
  <g transform="translate(945, 120)">
    <rect width="195" height="200" rx="10" fill="#161b22" stroke="#238636" stroke-width="2"/>
    <circle cx="30" cy="36" r="15" fill="#238636"/>
    <text x="30" y="41" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="58" y="41" font-size="16" font-weight="600" fill="#e6edf3">You get a card</text>
    <rect x="20" y="66" width="66" height="20" rx="4" fill="#238636"/>
    <text x="30" y="80" font-size="11" font-weight="700" font-family="ui-monospace, monospace" fill="#ffffff">USE IT</text>
    <rect x="20" y="94" width="150" height="20" rx="4" fill="#1f6feb"/>
    <text x="30" y="108" font-size="11" font-weight="700" font-family="ui-monospace, monospace" fill="#ffffff">ALREADY HAVE THIS</text>
    <rect x="20" y="122" width="62" height="20" rx="4" fill="#9e6a03"/>
    <text x="30" y="136" font-size="11" font-weight="700" font-family="ui-monospace, monospace" fill="#ffffff">RISKY</text>
    <rect x="20" y="150" width="70" height="20" rx="4" fill="#484f58"/>
    <text x="30" y="164" font-size="11" font-weight="700" font-family="ui-monospace, monospace" fill="#ffffff">SKIP IT</text>
  </g>

  <text x="60" y="378" font-size="13" fill="#6e7681">Every card ends with the sources it used and the date it checked them, so you can verify any line yourself.</text>
</svg>
